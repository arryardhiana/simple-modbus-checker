<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Modbus register reader and writer dashboard for serial and TCP devices." />
  <title>Modbus Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=Host+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="header-brand">
      <h1>Modbus Reader</h1>
      <span class="subtext">Instrumentation and diagnostic console</span>
    </div>
    <div class="header-controls">
      <div id="status" class="status disconnected" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <button id="theme-toggle" class="btn btn-ghost" type="button" aria-label="Toggle theme">Dark mode</button>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <div class="card-title-group">
          <h2>Connection</h2>
          <span id="conn-mode-badge" class="badge badge-serial">Serial (USB)</span>
        </div>
        <div class="actions">
          <button id="refresh-ports" class="btn btn-ghost" type="button">Refresh ports</button>
          <button id="toggle-connect" class="btn btn-primary" type="button">Connect</button>
        </div>
      </div>

      <div class="segmented-control" role="tablist" aria-label="Connection Type">
        <button type="button" class="segment-btn active" data-tab="serial" role="tab" aria-selected="true">
          <svg class="segment-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <span class="segment-text">Serial (USB, RS485)</span>
        </button>
        <button type="button" class="segment-btn" data-tab="tcp" role="tab" aria-selected="false">
          <svg class="segment-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          <span class="segment-text">Network (Modbus Gateway)</span>
        </button>
      </div>

      <form id="conn-form" class="form-grid" autocomplete="off">
        <input type="hidden" name="conn_type" id="conn-type-input" value="serial" />

        <!-- Serial settings -->
        <label class="full" data-conn="serial">
          <span>Serial Port</span>
          <select name="port" id="port-select"></select>
        </label>
        <label data-conn="serial">
          <span>Baud rate</span>
          <select name="baudrate">
            <option>2400</option>
            <option>4800</option>
            <option>9600</option>
            <option>19200</option>
            <option>38400</option>
            <option>57600</option>
            <option>115200</option>
          </select>
        </label>
        <label data-conn="serial">
          <span>Parity</span>
          <select name="parity">
            <option value="N">None</option>
            <option value="E">Even</option>
            <option value="O">Odd</option>
          </select>
        </label>
        <label data-conn="serial">
          <span>Stop bits</span>
          <select name="stopbits">
            <option>1</option>
            <option>2</option>
          </select>
        </label>
        <label data-conn="serial">
          <span>Data bits</span>
          <select name="bytesize">
            <option>8</option>
            <option>7</option>
          </select>
        </label>

        <!-- Network / Gateway settings -->
        <label class="full" data-conn="tcp" style="display: none;">
          <span>Gateway Host / IP Address</span>
          <input type="text" name="host" placeholder="192.168.1.100" value="192.168.1.100" />
        </label>
        <label data-conn="tcp" style="display: none;">
          <span>TCP Port</span>
          <input type="number" name="tcp_port" min="1" max="65535" value="502" />
          <span class="hint">Standard Modbus TCP is <b>502</b></span>
        </label>
        <label data-conn="tcp" style="display: none;">
          <span>Protocol Mode</span>
          <select name="framing">
            <option value="tcp">Modbus TCP (Standard)</option>
            <option value="rtu">Modbus RTU over TCP (Raw Encapsulation)</option>
          </select>
        </label>

        <!-- Common settings -->
        <label>
          <span id="slave-id-label">Slave ID</span>
          <input type="number" name="slave_id" min="1" max="247" value="1" />
          <span class="hint" id="slave-id-hint">Target RS485 slave address (1 to 247)</span>
        </label>
        <label>
          <span>Timeout (s)</span>
          <input type="number" name="timeout" step="0.1" min="0.1" value="1.0" />
        </label>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Registers</h2>
        <button id="add-reg" class="btn btn-primary" type="button">+ Add Register</button>
      </div>
      <div id="registers" class="reg-grid">
        <p class="muted">No registers yet. Click “Add Register” to begin.</p>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content card">
      <h2 id="modal-title">Add Register</h2>
      <form id="reg-form" class="form-grid" autocomplete="off">
        <label class="full">
          <span>Name</span>
          <input type="text" name="name" required placeholder="Voltage" />
        </label>
        <label>
          <span>Type</span>
          <select name="type">
            <option value="holding">Holding Register (Read FC03 / Write FC06)</option>
            <option value="input">Input Register (Read Only FC04)</option>
            <option value="coil">Coil (Read FC01 / Write FC05)</option>
            <option value="discrete">Discrete Input (Read Only FC02)</option>
          </select>
        </label>
        <label>
          <span>Address</span>
          <input type="number" name="address" min="0" max="65535" value="0" required />
        </label>
        <label data-show="register">
          <span>Data type</span>
          <select name="data_type">
            <option value="uint16">uint16</option>
            <option value="int16">int16</option>
            <option value="uint32">uint32 (2 regs)</option>
            <option value="int32">int32 (2 regs)</option>
            <option value="float32">float32 (2 regs)</option>
          </select>
        </label>
        <label data-show="register">
          <span>Word order (32-bit)</span>
          <select name="word_order">
            <option value="big">Big (ABCD)</option>
            <option value="little">Swap (CDAB)</option>
          </select>
          <small class="hint">Only matters for 32-bit types. If the value looks wrong, try Swap.</small>
        </label>
        <label data-show="register">
          <span>Scale</span>
          <input type="number" name="scale" step="any" value="1" />
          <small class="hint">Multiplier on the raw value. Sensor returns 328 with 0.1 scale displays as 32.8.</small>
        </label>
        <label data-show="register">
          <span>Offset</span>
          <input type="number" name="offset" step="any" value="0" />
          <small class="hint">Added after scale. For Kelvin to Celsius, set -273.15.</small>
        </label>
        <label data-show="register">
          <span>Unit</span>
          <input type="text" name="unit" placeholder="V, A, °C" />
          <small class="hint">Unit symbol displayed beside the measured value.</small>
        </label>
        <div class="modal-actions full">
          <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="write-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content card">
      <h2 id="write-modal-title">Write Register</h2>
      <p id="write-modal-subtitle" class="muted write-modal-sub"></p>
      
      <div class="write-info-box">
        <span class="info-label">Current Value</span>
        <span class="info-val measured" id="write-current-val">-</span>
      </div>

      <form id="write-form" class="form-grid" autocomplete="off">
        <label class="full" id="write-input-label">
          <span id="write-input-title">New value to send</span>
          <input type="number" step="any" name="write_value" id="write-input-val" required placeholder="Enter numeric value" />
        </label>
        <div id="write-coil-container" class="full write-coil-box">
          <span>Set Coil State (ON / OFF)</span>
          <input type="checkbox" class="toggle" id="write-coil-toggle" aria-label="Toggle coil state" />
        </div>
        <div class="modal-actions full">
          <button type="button" class="btn btn-ghost" id="write-modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="write-submit-btn">Send</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
